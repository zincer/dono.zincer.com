# Toolchain and tasks for the Dono landing page.
# Put secrets (GH_TOKEN for the zincer GitHub account) in mise.local.toml, which is gitignored.
# See mise.local.toml.example.

[tools]
node = "24"

[tasks.dev]
description = "Start the Astro dev server"
run = "npm run dev"

[tasks.build]
description = "Build the static site into dist/"
run = "npm run build"

[tasks.test]
description = "Unit tests, type check, then the Playwright suite"
run = ["npm test", "npm run check", "npm run test:e2e"]
